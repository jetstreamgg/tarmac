<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Set theme before first paint to avoid a flash (FOUC). Mirrors the
         resolution in src/lib/theme.ts: stored choice, else OS pref, else dark.
         Also preloads the theme's page background image so the shell doesn't
         paint on a bare backdrop while the CSS background downloads, and tints
         the mobile browser chrome (theme-color) so the iOS status bar isn't
         black for the trip to React. The colours are the THEME_COLORS twins —
         inlined for the same reason the image paths are; keep them in step. -->
    <script>
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('user-settings') || '{}').theme;
          var theme =
            stored ||
            (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark');
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
        var isLight = document.documentElement.dataset.theme === 'light';
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.href = isLight ? '/images/background-light.webp' : '/images/background-dark.webp';
        document.head.appendChild(link);
        var themeColor = document.createElement('meta');
        themeColor.name = 'theme-color';
        themeColor.content = isLight ? '#dbdfff' : '#100b27';
        document.head.appendChild(themeColor);
      })();
    </script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1" />
    <title>Sky | Get rewarded for saving, without giving up control</title>

    <!-- Pinned Sites  -->
    <meta name="application-name" content="Sky | Get rewarded for saving, without giving up control" />
    <meta name="msapplication-tooltip" content="Sky | Get rewarded for saving, without giving up control" />
    <meta name="msapplication-starturl" content="/" />

    <!-- Tap highlighting  -->
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- UC Mobile Browser  -->
    <meta name="full-screen" content="yes" />
    <meta name="browsermode" content="application" />

    <!-- Disable night mode for this page  -->
    <meta name="nightmode" content="enable/disable" />

    <!-- Layout mode -->
    <meta name="layoutmode" content="fitscreen/standard" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.sky.money/" />
    <meta property="og:title" content="Sky | Get rewarded for saving, without giving up control" />
    <meta
      property="og:description"
      content="Access DeFi savings, rewards, and trading opportunities with Sky Protocol"
    />
    <meta property="og:image" content="https://app.sky.money/images/social_media_image.png" />
    <meta property="og:site_name" content="Sky" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sky | Get rewarded for saving, without giving up control" />
    <meta
      name="twitter:description"
      content="Access DeFi savings, rewards, and trading opportunities with Sky Protocol"
    />
    <meta name="twitter:image" content="https://app.sky.money/images/social_media_image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/pages/main.tsx"></script>
  </body>
</html>
