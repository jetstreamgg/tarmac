name: E2E Tests (Pool)

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      shards:
        description: 'Number of shards'
        required: false
        default: '8'
        type: string
      workers_per_shard:
        description: 'Workers per shard'
        required: false
        default: '2'
        type: string
      networks:
        description: 'Networks to test (comma-separated)'
        required: false
        default: 'mainnet,base,arbitrum,optimism,unichain'
        type: string

concurrency:
  group: e2e-pool-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Job to restore pool VNets and validate before shards run
  setup-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      pool-ready: ${{ steps.pool-status.outputs.status }}
      # Fallback only: fresh VNet IDs and snapshot IDs (no RPC URLs), base64 because
      # the pool secret is masked line by line, `{` included, and GitHub drops any
      # job output containing a masked value.
      vnet-ids: ${{ steps.export-ids.outputs.vnet-ids }}
      snapshots: ${{ steps.export-ids.outputs.snapshots }}

    env:
      VITE_ENV_NAME: development
      VITE_TERMS_LINK: '[{"url":"https://legal-terms","name":"Terms of Use"}]'
      VITE_BATCH_TX_ENABLED: 'true'
      VITE_USE_MOCK_WALLET: 'true'
      VITE_SKIP_AUTH_CHECK: 'true'
      # The forced-checks e2e specs (APP-502) route-mock /terms-acceptance/check,
      # but the app only issues that request when the endpoint is a well-formed URL
      # — without this the terms modal opens in its error state and the accept
      # flow can never find its checkbox.
      VITE_TERMS_ENDPOINT: 'https://staging-api.sky.money/terms-acceptance'
      VITE_GEO_BYPASS: 'true'
      VITE_PROXY_ORIGIN: 'https://staging-proxy.sky.money'
      FUND_NETWORKS: ${{ github.event.inputs.networks || 'mainnet,base,arbitrum,optimism,unichain' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Restore pool VNet data from repo secrets
        id: restore-pool
        run: |
          # VNET_POOL_DATA / VNET_SNAPSHOT_DATA are Actions secrets (Settings → Secrets).
          # Keep as secrets: they embed full Tenderly RPC URLs (bearer credentials).
          # vars would leak to fork PRs and are not masked in logs.
          if [ -n "$VNET_POOL_DATA" ] && [ -n "$VNET_SNAPSHOT_DATA" ]; then
            echo "Writing VNet data from repo secrets..."

            printf '%s' "$VNET_POOL_DATA" > tenderlyTestnetData.json
            printf '%s' "$VNET_SNAPSHOT_DATA" > apps/webapp/src/test/e2e/persistent-vnet-snapshots.json

            # Log only metadata (counts) — never echo the secret payloads.
            POOL_NETWORKS=$(jq -r '.[].NETWORK' tenderlyTestnetData.json 2>/dev/null | wc -l | tr -d ' ')
            SNAPSHOT_COUNT=$(jq -r 'keys | length' apps/webapp/src/test/e2e/persistent-vnet-snapshots.json 2>/dev/null)

            echo "have_pool=true" >> $GITHUB_OUTPUT
            echo "Pool VNet data restored: ${POOL_NETWORKS} networks, ${SNAPSHOT_COUNT} snapshots"
          else
            echo "have_pool=false" >> $GITHUB_OUTPUT
            echo "No pool data found in repo secrets."
            echo "Run: pnpm vnet:pool:provision:store"
          fi
        env:
          VNET_POOL_DATA: ${{ secrets.VNET_POOL_DATA }}
          VNET_SNAPSHOT_DATA: ${{ secrets.VNET_SNAPSHOT_DATA }}

      - name: Validate pool VNets
        id: validate-pool
        if: steps.restore-pool.outputs.have_pool == 'true'
        run: |
          echo "Validating pool VNets..."
          cd apps/webapp && npx tsx src/test/e2e/validate-vnets.ts
        env:
          TENDERLY_API_KEY: ${{ secrets.TENDERLY_API_KEY }}
        continue-on-error: true

      - name: Pool status
        id: pool-status
        run: |
          if [ "${{ steps.restore-pool.outputs.have_pool }}" = "true" ] && [ "${{ steps.validate-pool.outcome }}" = "success" ]; then
            echo "status=ready" >> $GITHUB_OUTPUT
            echo "Pool VNets are healthy!"
          else
            echo "status=unavailable" >> $GITHUB_OUTPUT
            echo "Pool VNets are not available or unhealthy."
            echo "Falling back to fresh VNet provisioning..."
          fi

      - name: Fallback - Create fresh VNets
        if: steps.pool-status.outputs.status == 'unavailable'
        run: |
          echo "Creating fresh VNets (fallback)..."
          pnpm run vnet:fork:ci
          echo "Fresh VNets created"
        env:
          TENDERLY_API_KEY: ${{ secrets.TENDERLY_API_KEY }}

      - name: Fallback - Fund accounts and create snapshots
        if: steps.pool-status.outputs.status == 'unavailable'
        run: |
          echo "Funding all test accounts on all networks..."
          cd apps/webapp
          pnpm e2e:fund

          if [ ! -f "src/test/e2e/persistent-vnet-snapshots.json" ]; then
            echo "Snapshots were not created!"
            exit 1
          fi
          echo "Snapshots created and verified"
        env:
          TENDERLY_API_KEY: ${{ secrets.TENDERLY_API_KEY }}

      # Shards never get tenderlyTestnetData.json from this job: it holds the
      # VNets' Admin RPC URLs, and an artifact is that file in plaintext (secret
      # masking covers logs, not artifacts). Pool shards re-read the secrets;
      # fallback shards get the IDs here and look the URLs up with
      # TENDERLY_API_KEY (APP-479).
      - name: Export VNet IDs for shards (fallback only)
        id: export-ids
        if: steps.pool-status.outputs.status == 'unavailable'
        run: |
          echo "vnet-ids=$(jq -c '[.[] | {NETWORK, TENDERLY_TESTNET_ID}]' tenderlyTestnetData.json | base64 -w0)" >> $GITHUB_OUTPUT
          echo "snapshots=$(jq -c . apps/webapp/src/test/e2e/persistent-vnet-snapshots.json | base64 -w0)" >> $GITHUB_OUTPUT

      - name: Verify setup is ready
        run: |
          if [ -f "tenderlyTestnetData.json" ] && [ -f "apps/webapp/src/test/e2e/persistent-vnet-snapshots.json" ]; then
            echo "VNets are ready for sharded tests"
          else
            echo "VNet files are missing!"
            exit 1
          fi

  # Run tests in shards
  test-shards:
    needs: setup-pool
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    env:
      VITE_ENV_NAME: development
      VITE_TERMS_LINK: '[{"url":"https://legal-terms","name":"Terms of Use"}]'
      VITE_BATCH_TX_ENABLED: 'true'
      VITE_USE_MOCK_WALLET: 'true'
      VITE_SKIP_AUTH_CHECK: 'true'
      # The forced-checks e2e specs (APP-502) route-mock /terms-acceptance/check,
      # but the app only issues that request when the endpoint is a well-formed URL
      # — without this the terms modal opens in its error state and the accept
      # flow can never find its checkbox.
      VITE_TERMS_ENDPOINT: 'https://staging-api.sky.money/terms-acceptance'
      VITE_GEO_BYPASS: 'true'
      VITE_PROXY_ORIGIN: 'https://staging-proxy.sky.money'
      PLAYWRIGHT_SHARD_INDEX: ${{ matrix.shard }}
      PLAYWRIGHT_SHARD_TOTAL: ${{ github.event.inputs.shards || '8' }}
      TEST_WORKERS: ${{ github.event.inputs.workers_per_shard || '2' }}
      FUND_NETWORKS: ${{ github.event.inputs.networks || 'mainnet,base,arbitrum,optimism,unichain' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browsers
        run: pnpm -F webapp exec playwright install --with-deps chromium

      - name: Restore pool VNet data from repo secrets
        if: needs.setup-pool.outputs.pool-ready == 'ready'
        run: |
          printf '%s' "$VNET_POOL_DATA" > tenderlyTestnetData.json
          printf '%s' "$VNET_SNAPSHOT_DATA" > apps/webapp/src/test/e2e/persistent-vnet-snapshots.json
        env:
          VNET_POOL_DATA: ${{ secrets.VNET_POOL_DATA }}
          VNET_SNAPSHOT_DATA: ${{ secrets.VNET_SNAPSHOT_DATA }}

      - name: Restore fresh VNet data from IDs (fallback)
        if: needs.setup-pool.outputs.pool-ready != 'ready'
        run: |
          VNET_IDS="$(printf '%s' "$VNET_IDS_B64" | base64 -d)" node ./scripts/restoreVnetData.ts
          printf '%s' "$VNET_SNAPSHOTS_B64" | base64 -d > apps/webapp/src/test/e2e/persistent-vnet-snapshots.json
        env:
          TENDERLY_API_KEY: ${{ secrets.TENDERLY_API_KEY }}
          VNET_IDS_B64: ${{ needs.setup-pool.outputs.vnet-ids }}
          VNET_SNAPSHOTS_B64: ${{ needs.setup-pool.outputs.snapshots }}

      - name: Verify VNet files
        run: |
          echo "Verifying VNet files for shard ${{ matrix.shard }}..."
          echo "Checking tenderlyTestnetData.json:"
          ls -lh tenderlyTestnetData.json
          echo "Checking persistent-vnet-snapshots.json:"
          ls -lh apps/webapp/src/test/e2e/persistent-vnet-snapshots.json
          echo "VNet files ready"

      - name: Run E2E tests (Shard ${{ matrix.shard }}/${{ github.event.inputs.shards || '8' }})
        run: |
          echo "Running shard ${{ matrix.shard }} of ${{ github.event.inputs.shards || '8' }}"
          echo "Workers per shard: $TEST_WORKERS"
          echo "Pool status: ${{ needs.setup-pool.outputs.pool-ready }}"

          chmod +x ./apps/webapp/run-tests-with-retry.sh
          cd apps/webapp && ./run-tests-with-retry.sh
        env:
          TENDERLY_API_KEY: ${{ secrets.TENDERLY_API_KEY }}

      - name: Upload test results (if failed)
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shard-${{ matrix.shard }}-test-results-${{ github.run_id }}
          path: |
            apps/webapp/playwright-report/
            apps/webapp/test-results/
            apps/webapp/test-results.json
          retention-days: 7

      - name: Upload test traces (if failed)
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shard-${{ matrix.shard }}-test-traces-${{ github.run_id }}
          path: apps/webapp/test-results/
          retention-days: 3

  # Aggregate results from all shards
  aggregate-results:
    needs: [setup-pool, test-shards]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download all shard results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: shard-*-test-results-${{ github.run_id }}
          path: all-results
        continue-on-error: true

      - name: Test Summary
        run: |
          echo "## E2E Test Summary (Pool)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Pool status**: ${{ needs.setup-pool.outputs.pool-ready }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Shards**: ${{ github.event.inputs.shards || '8' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Workers per Shard**: ${{ github.event.inputs.workers_per_shard || '2' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Networks**: ${{ github.event.inputs.networks || 'mainnet,base,arbitrum,optimism,unichain' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.setup-pool.outputs.pool-ready }}" = "ready" ]; then
            echo "- **Mode**: Pool VNets (fast - snapshot revert)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Mode**: Fresh VNets (fallback - full provisioning)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.test-shards.result }}" == "success" ]; then
            echo "### All shards passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Some shards failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check individual shard artifacts for details." >> $GITHUB_STEP_SUMMARY
          fi

  # Cleanup fresh VNets only (never delete pool VNets)
  cleanup:
    needs: [setup-pool, test-shards, aggregate-results]
    if: always() && needs.setup-pool.outputs.pool-ready == 'unavailable'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # This run's fresh VNets by ID (the age sweep skips anything under 45
      # minutes, so it rarely caught them), then the sweep as a backstop.
      - name: Cleanup fresh VNets (fallback only)
        run: |
          echo "Cleaning up fresh VNets (not pool VNets)..."
          if [ -n "$VNET_IDS_B64" ]; then
            printf '%s' "$VNET_IDS_B64" | base64 -d > tenderlyCreatedVnets.json
            pnpm run vnet:delete:created:ci || echo "Deleting this run's VNets failed, continuing..."
          fi
          pnpm run vnet:delete:all:ci || echo "VNet cleanup failed, continuing..."
        env:
          TENDERLY_API_KEY: ${{ secrets.TENDERLY_API_KEY }}
          VNET_IDS_B64: ${{ needs.setup-pool.outputs.vnet-ids }}
